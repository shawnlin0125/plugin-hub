# Plugin Hub — Plugin Registry
# Each entry defines a vendor plugin managed by the hub.
# Plugins are independent Python packages in the ticket-vendor repo.
# Tests run in isolated CI environments.

plugins:
  - id: ticketmaster
    name: "TicketMaster"
    version: "0.1.0"
    description: "TicketMaster API integration — search events, fetch availability, reserve tickets"
    repo: "https://github.com/shawnlin0125/ticket-vendor"
    test_command: "cd plugins/ticketmaster && python -m pytest -v --json-report"
    enabled: false

