# ArgoCD Application for plugin-hub
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plugin-hub
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/shawnlin0125/plugin-hub
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: plugin-hub
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
