apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-core
  labels:
    app: plugin-hub
    component: core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plugin-hub
      component: core
  template:
    metadata:
      labels:
        app: plugin-hub
        component: core
    spec:
      containers:
      - name: platform
        image: ghcr.io/shawnlin0125/plugin-hub:latest
        ports:
        - containerPort: 8000
        env:
        - name: LOAD_PLUGINS
          value: ""  # Core does not load plugins — just the API
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: platform-core
spec:
  selector:
    app: plugin-hub
    component: core
  ports:
  - port: 8000
    targetPort: 8000
