# Routing table: which plugin goes to which deployment
# 
# Each plugin has:
#   target: k8s Deployment name
#
# Default target (when not listed): "vendor-bundle"

ticketmaster:
  target: vendor-heavy-1
  reason: "High volume — dedicated deployment"

kktix:
  target: vendor-heavy-2
  reason: "High volume — dedicated deployment"

ibon:
  target: vendor-bundle

fami:
  target: vendor-bundle

tixcraft:
  target: vendor-bundle
