# ── Hub Admin ──
# Dashboard + management API. Lightweight, single replica.
# Serves:
#   - Dashboard (hub.shawnlin.online/)
#   - Admin API (/api/plugins, /api/load-plugins)
#   - Reverse proxy to ticket-proxy (/api/v1/{vendor}/*)
apiVersion: v1
kind: Namespace
metadata:
  name: plugin-hub
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub-admin
  namespace: plugin-hub
  labels:
    app: hub-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hub-admin
  template:
    metadata:
      labels:
        app: hub-admin
    spec:
      containers:
      - name: hub-admin
        image: plugin-hub:go-latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: TZ
          value: "Asia/Taipei"
        - name: MANIFEST_URL
          value: "https://raw.githubusercontent.com/shawnlin0125/ticket-vendor/main/plugin-manifest.json"
        - name: PROXY_SVC
          value: "ticket-proxy.plugin-hub.svc.cluster.local:8000"
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: hub-admin
  namespace: plugin-hub
spec:
  selector:
    app: hub-admin
  ports:
  - port: 80
    targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plugin-hub
  namespace: plugin-hub
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  rules:
  - host: hub.shawnlin.online
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hub-admin
            port:
              number: 80
  tls:
  - hosts:
    - hub.shawnlin.online
    secretName: hub-shawnlin-online-tls
