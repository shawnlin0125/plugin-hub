[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plugin-hub"
version = "0.1.0"
description = "Universal plugin management platform — discover, enable/disable, and test-gate plugins"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Shawn Lin"}]
dependencies = [
    "platform-plugin-sdk",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]

[tool.setuptools.packages.find]
include = ["plugin_hub_app*", "platform_plugin_sdk*"]
